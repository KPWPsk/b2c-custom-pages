<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>Sign in</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- ใช้ CSS ตามเทมเพลตของ B2C ก็ได้ หรือจะไม่ใส่ก็ได้ -->
  <style>
    body {
      font-family: Segoe UI, Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel {
      background: #fff;
      padding: 30px 25px;
      border-radius: 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      max-width: 420px;
      width: 100%;
    }
    .logo {
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <div class="logo">
        <img src="https://login.microsoftonline.com/static/tenant/templates/images/logo.svg"
             alt="Logo" style="height:40px;" />
      </div>

      <!-- B2C จะ render ฟอร์มลงใน div นี้ -->
      <div id="api" role="main"></div>
    </div>
  </div>

  <!-- สคริปต์เพิ่มข้อความอธิบาย UserID -->
  <script>
    (function () {
      function addUserIdHelpBox() {
        var container =
          document.querySelector('#api .localAccount') ||
          document.getElementById('localAccountForm') ||
          document.getElementById('api');

        if (!container) return;
        if (document.getElementById('userIdHelpBox')) return;

        var intro =
          container.querySelector('.intro') ||
          container.querySelector('h2') ||
          container.firstChild;

        if (!intro) return;

        var box = document.createElement('div');
        box.id = 'userIdHelpBox';
        box.innerHTML = `
          <div style="
              border:1px solid #0094ff;
              background:#f0f8ff;
              padding:10px 12px;
              font-size:13px;
              color:#333;
              text-align:left;
              margin:10px 0 20px 0;
          ">
            <strong>รูปแบบ UserID สำหรับลงชื่อเข้าใช้</strong>
            <ul style="margin-top:6px; padding-left:18px;">
              <li>กรุณาลงชื่อเข้าใช้ด้วย <b>UserID</b> เท่านั้น</li>
              <li><b>ขึ้นต้นด้วย "zz"</b> ตามด้วยชื่อผู้ใช้ เช่น <b>zztest</b></li>
              <li>สามารถใช้ A–Z, a–z และตัวเลข 0–9 ได้เท่านั้น</li>
            </ul>
          </div>
        `;

        intro.insertAdjacentElement('afterend', box);
      }

      document.addEventListener('DOMContentLoaded', function () {
        var api = document.getElementById('api');
        if (!api) return;

        var observer = new MutationObserver(function () {
          addUserIdHelpBox();
        });

        observer.observe(api, { childList: true, subtree: true });
      });
    })();
  </script>
</body>
</html>
