<!DOCTYPE html>
<html>
<head>
    <title>Sign in</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- bootstrap ของ Microsoft -->
    <link href="https://ajax.aspnetcdn.com/ajax/bootstrap/3.3.5/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* ไม่แตะพื้นหลัง B2C – ให้ใช้ของระบบ */
        #background_branding_container img {
            object-fit: cover !important;
        }

        .unified_container {
            min-height: 100vh;
            display: flex !important;
            justify-content: center;
            align-items: center;
        }

        .panel-default {
            margin: 0 auto;
            max-width: 480px;
        }

        .companyLogo {
            display: block;
            margin: 0 auto 20px auto;
            max-height: 60px;
        }

        /* ซ่อนหัวข้อ Sign in */
        #api h1, 
        #api h2, 
        #api h3,
        #api .panel-title,
        #api .intro,
        #api .intro p {
            display: none !important;
        }

    </style>
</head>
<body>

    <div class="container unified_container">
        <div class="row">
            <div class="col-lg-6">
                <div class="panel panel-default">
                    <div class="panel-body">

                        <!-- โลโก้ -->
                        <img class="companyLogo"
                             src="https://login.microsoftonline.com/static/tenant/templates/images/logo.svg"
                             alt="Company Logo">

                        <!-- คำอธิบาย -->
                        <div id="userId-help"
                             style="font-size:13px;color:#555;margin:10px 0 20px 0;text-align:left;">
                            <p style="font-weight:bold;">รูปแบบ UserID สำหรับลงชื่อเข้าใช้</p>
                            <ul style="margin-left:20px;">
                                <li>ต้องขึ้นต้นด้วย <strong>“zz”</strong> เช่น <code>zztest</code></li>
                                <li>อนุญาตตัวอักษร A–Z, a–z และตัวเลข 0–9</li>
                                <li>ห้ามมีช่องว่าง หรืออักขระพิเศษ</li>
                            </ul>
                        </div>

                        <!-- ฟอร์มจาก Azure B2C -->
                        <div id="api" role="main"></div>

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
