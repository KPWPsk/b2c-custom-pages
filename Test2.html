<!DOCTYPE html>
<html>
<head>
    <title>Sign in</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ใช้ bootstrap ของ Microsoft ตามเดิม -->
    <link href="https://ajax.aspnetcdn.com/ajax/bootstrap/3.3.5/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }

        /* ทำให้ container อยู่กลางจอทั้งแนวตั้งและแนวนอน */
        .unified_container {
            min-height: 100vh;
            display: flex !important;
            justify-content: center;
            align-items: center;
        }

        .unified_container .row {
            width: 100%;
        }

        .unified_container .col-lg-6 {
            float: none;
            margin: 0 auto;
        }

        .panel-default {
            margin: 0 auto;
            max-width: 480px;
        }

        .companyLogo {
            display: block;
            margin: 0 auto 10px auto;
            max-height: 60px;
        }

        /* พื้นหลังด้านหลังฟอร์ม */
        #background_branding_container img {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* ซ่อนหัวข้อ Sign in / Sign in with your username ที่ B2C ใส่มา */
        #api h1,
        #api h2,
        #api h3,
        #api .panel-title,
        #api .intro,
        #api .intro p {
            display: none !important;
        }

        /* สไตล์ช่องกรอกให้ดูเรียบร้อย */
        #api label {
            font-weight: 600;
            margin-bottom: 4px;
        }

        #api input[type="text"],
        #api input[type="email"],
        #api input[type="password"] {
            width: 100% !important;
            height: 44px !important;
            padding: 10px 14px !important;
            border: 1px solid #a6a6a6 !important;
            border-radius: 6px !important;
            font-size: 14px !important;
            box-sizing: border-box !important;
            background-color: #ffffff !important;
        }

        #api input[type="text"]:focus,
        #api input[type="email"]:focus,
        #api input[type="password"]:focus {
            outline: none !important;
            border-color: #106ebe !important;
            box-shadow: 0 0 0 1px #106ebe33 !important;
        }

        /* ปุ่ม Sign in สีน้ำเงิน */
        #api button,
        #api input[type="submit"],
        #api button#next {
            width: 100%;
            border-radius: 4px;
            border: none;
            padding: 10px 0;
            font-size: 14px;
            font-weight: 600;
            background-color: #106ebe;
            color: #ffffff;
            cursor: pointer;
            margin-top: 10px;
        }

        #api button:hover,
        #api input[type="submit"]:hover,
        #api button#next:hover {
            background-color: #005a9e;
        }
    </style>
</head>
<body>

    <!-- Background -->
    <div id="background_branding_container">
        <img src="https://login.microsoftonline.com/static/tenant/templates/backgrounds/1-1.png"
             alt="Background Image">
    </div>

    <div class="container unified_container" role="presentation">
        <div class="row">
            <div class="col-lg-6">
                <div class="panel panel-default">
                    <div class="panel-body">

                        <!-- โลโก้ -->
                        <img class="companyLogo"
                             src="https://login.microsoftonline.com/static/tenant/templates/images/logo.svg"
                             alt="Company Logo">

                        <!-- ข้อความอธิบาย UserID -->
                        <div id="userId-help"
                             style="font-size:13px;color:#555;margin:10px 0 20px 0;text-align:left;">
                            <p style="font-weight:bold;">
                                รูปแบบ UserID สำหรับลงชื่อเข้าใช้
                            </p>
                            <ul style="margin-left:20px; padding-left:0;">
                                <li>ต้องขึ้นต้นด้วย <strong>“zz”</strong> ตามด้วยชื่อผู้ใช้ เช่น
                                    <code>zztest</code>
                                </li>
                                <li>สามารถใช้ตัวอักษร <strong>A–Z, a–z</strong> และตัวเลข
                                    <strong>0–9</strong> ได้
                                </li>
                                <li>ห้ามมีช่องว่าง หรืออักขระพิเศษ
                                    (เช่น <code>!</code>, <code>@</code>, <code>#</code>, <code>$</code> เป็นต้น)
                                </li>
                            </ul>
                        </div>

                        <!-- ฟอร์ม sign-in / sign-up ที่ Azure B2C จะ render ใส่เข้ามา -->
                        <div id="api" role="main"></div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- สคริปต์จัดตำแหน่ง Forgot / Sign up -->
    <script>
document.addEventListener("DOMContentLoaded", function () {

    // รอให้ B2C render ฟอร์มเสร็จ
    var tries = 0;
    var timer = setInterval(function () {
        tries++;

        var api = document.querySelector("#api");
        if (!api) return;

        // 1) หา <input type="password">
        var passwordInput = api.querySelector("input[type='password']");

        // 2) หา <a> ที่เป็น "Forgot your password?"
        var forgotLink = Array.from(api.querySelectorAll("a")).find(function (a) {
            return (a.textContent || "").trim().toLowerCase().indexOf("forgot your password") !== -1;
        });

        // 3) หา ปุ่ม Sign in
        var signInButton = api.querySelector("button[type='submit'], button#next, input[type='submit']");

        // 4) หา <a> ที่เป็น "Sign up now"
        var signUpLink = Array.from(api.querySelectorAll("a")).find(function (a) {
            return (a.textContent || "").trim().toLowerCase().indexOf("sign up now") !== -1;
        });

        // ---------- ย้าย Forgot your password? ไปไว้ใต้ Password ----------
        if (passwordInput && forgotLink) {
            // เอาออกจากที่เดิมก่อน
            if (forgotLink.parentNode) {
                forgotLink.parentNode.removeChild(forgotLink);
            }
            // แทรก "หลัง" ช่อง password
            passwordInput.insertAdjacentElement("afterend", forgotLink);
            forgotLink.style.display = "block";
            forgotLink.style.margin = "4px 0 10px 0";
        }

        // ---------- ย้าย Don’t have an account? Sign up now ไปใต้ปุ่ม ----------
        if (signInButton && signUpLink) {
            // ดึงทั้งประโยคที่หุ้มลิงก์ เช่น <p>Don't have an account? <a>Sign up now</a></p>
            var signUpContainer = signUpLink.closest("p, div, span") || signUpLink;

            if (signUpContainer.parentNode) {
                signUpContainer.parentNode.removeChild(signUpContainer);
            }

            // แทรกลง "หลัง" ปุ่ม Sign in
            signInButton.insertAdjacentElement("afterend", signUpContainer);
            signUpContainer.style.marginTop = "10px";
        }

        // ถ้าลองครบ 30 รอบแล้วยังไม่เจออะไร ให้หยุด
        if ((passwordInput && forgotLink && signInButton && signUpLink) || tries > 30) {
            clearInterval(timer);
        }

    }, 300);
});
</script>

</body>
</html>
