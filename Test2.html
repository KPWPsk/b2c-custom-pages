<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>Sign in</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap ของ Microsoft -->
    <link href="https://ajax.aspnetcdn.com/ajax/bootstrap/3.3.5/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        /* ----- ซ่อนหัวข้อ Sign in / Sign in with your username ----- */
        #api h1,
        #api h2,
        #api h3,
        #api .panel-title,
        #api .intro,
        #api .intro p {
            display: none !important;
        }

        /* ----- สไตล์ข้อความช่วยเหลือ UserID ----- */
        .userId-help-custom {
            font-size: 13px;
            color: #555;
            margin-bottom: 20px;
            text-align: left;
        }

        .userId-help-custom p {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .userId-help-custom ul {
            margin-left: 20px;
            padding-left: 0;
        }

        .userId-help-custom code {
            background: #ffe5ec;
            padding: 2px 4px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <!-- ให้ B2C render ฟอร์มลงตำแหน่งนี้ -->
    <div id="api"></div>

    <!-- ===== เพิ่มข้อความช่วยเหลือ UserID ===== -->
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        var tries = 0;
        var timer = setInterval(function () {
            tries++;

            var panelBody = document.querySelector("#api .panel-default .panel-body");

            if (panelBody) {
                var help = document.createElement("div");
                help.className = "userId-help-custom";

                help.innerHTML = `
                    <p>รูปแบบ UserID สำหรับลงชื่อเข้าใช้</p>
                    <ul>
                        <li>ต้องขึ้นต้นด้วย <strong>“zz”</strong> เช่น <code>zztest</code></li>
                        <li>อนุญาตตัวอักษร <strong>A–Z, a–z</strong> และตัวเลข <strong>0–9</strong></li>
                        <li>ห้ามมีช่องว่าง หรืออักขระพิเศษ</li>
                    </ul>
                `;

                panelBody.insertBefore(help, panelBody.firstChild);

                clearInterval(timer);
            }

            if (tries > 30) clearInterval(timer);
        }, 300);
    });
    </script>

    <!-- ===== ย้าย Forgot your password? ไปไว้ใต้ Password ===== -->
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        var tries = 0;
        var timer = setInterval(function () {
            tries++;

            var apiContainer = document.querySelector("#api");

            var passwordInput = apiContainer.querySelector("input[type='password']");
            var forgotLink = apiContainer.querySelector("a[id*='forgot'], a[href*='forgot']");

            if (passwordInput && forgotLink) {

                passwordInput.parentNode.appendChild(forgotLink);

                clearInterval(timer);
            }

            if (tries > 30) clearInterval(timer);
        }, 300);
    });
    </script>

</body>
</html>
