<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>Sign in</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- ใช้ CSS ตามเทมเพลตของ B2C ก็ได้ หรือจะไม่ใส่ก็ได้ -->
  <style>
    body {
      font-family: Segoe UI, Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel {
      background: #fff;
      padding: 30px 25px;
      border-radius: 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      max-width: 420px;
      width: 100%;
    }
    .logo {
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <div class="logo">
        <img src="https://login.microsoftonline.com/static/tenant/templates/images/logo.svg"
             alt="Logo" style="height:40px;" />
      </div>

      <!-- B2C จะ render ฟอร์มลงใน div นี้ -->
      <div id="api" role="main"></div>
    </div>
  </div>
  
 <script>
(function () {
  var HELP_ID = "userIdHelpBox";

  function addUserIdHelpText() {
    // ถ้าสร้างไปแล้ว ไม่ต้องทำซ้ำ
    if (document.getElementById(HELP_ID)) return;

    // หา h1/h2 ที่มีข้อความ "Sign in with your email address"
    var headings = document.querySelectorAll("h1, h2, h3");
    var target = null;

    headings.forEach(function (h) {
      var text = (h.textContent || "").trim();
      if (text === "Sign in with your email address") {
        target = h;
      }
    });

    if (!target) return; // ยังหาไม่เจอ รอรอบต่อไปจาก MutationObserver

    // สร้างกล่องคำอธิบาย
    var box = document.createElement("div");
    box.id = HELP_ID;
    box.style.margin = "8px 0 16px 0";
    box.style.fontSize = "13px";
    box.style.color = "#333";
    box.style.textAlign = "left";

    box.innerHTML = ''
      + '<div style="'
      + 'border:1px solid #0094ff;'
      + 'background:#f0f8ff;'
      + 'padding:10px 12px;'
      + 'border-radius:4px;'
      + '">'
      + '<strong>รูปแบบ UserID สำหรับลงชื่อเข้าใช้</strong>'
      + '<ul style="margin-top:6px; padding-left:18px;">'
      + '  <li>กรุณาลงชื่อเข้าใช้ด้วย <b>UserID</b> เท่านั้น</li>'
      + '  <li><b>ขึ้นต้นด้วย "zz"</b> ตามด้วยชื่อผู้ใช้ เช่น <b>zztest</b></li>'
      + '  <li>สามารถใช้ตัวอักษร A–Z, a–z และตัวเลข 0–9 ได้เท่านั้น</li>'
      + '</ul>'
      + '</div>';

    // แทรกกล่องใต้หัวข้อ
    target.insertAdjacentElement("afterend", box);
  }

  document.addEventListener("DOMContentLoaded", function () {
    // เรียกครั้งแรกเผื่อ DOM มาแล้ว
    addUserIdHelpText();

    // เฝ้าดูการเปลี่ยนแปลง DOM (ตอน B2C render ฟอร์ม)
    var observer = new MutationObserver(function () {
      addUserIdHelpText();
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  });
})();
</script>

</body>
</html>
